language: "es-ES"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  path_instructions:
    - path: "dsp_engine/contracts.py"
      instructions: "Archivo de contratos críticos congelados en Python. Alertar de inmediato si cualquier cambio rompe compatibilidad hacia atrás con los 4 módulos DSP o con src/types/dsp.ts."
    - path: "dsp_engine/**/*.py"
      instructions: "Verificar rigor matemático DSP y compatibilidad con Pyodide (evitar dependencias C no incluidas en Pyodide como Pillow/soundfile; usar NumPy/SciPy vectorizado, evitar divisiones por cero y validar estabilidad de filtros IIR)."
    - path: "tests_py/**/*.py"
      instructions: "Verificar que las pruebas validen invariantes físicas (Parseval, BER=0 sin ruido, MSE=0 en lossless, Nyquist) y no solo aserciones triviales."
