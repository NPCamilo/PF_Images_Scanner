language: "es-ES"
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  path_instructions:
    - path: "src/types/dsp.ts"
      instructions: "Archivo de contratos críticos congelados. Alertar de inmediato si cualquier cambio rompe compatibilidad hacia atrás con los 4 módulos DSP."
    - path: "src/dsp/**/*.ts"
      instructions: "Verificar rigor matemático DSP: evitar divisiones por cero, validar potencia de 2 en FFT, comprobar estabilidad de filtros IIR y exigir uso de Float64Array/Uint8Array en operaciones vectoriales."
    - path: "tests/**/*.test.ts"
      instructions: "Verificar que los tests validen invariantes físicas (Parseval, BER=0 sin ruido, MSE=0 en lossless, Nyquist) y no solo aserciones triviales."
