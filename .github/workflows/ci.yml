name: Nexus-DSP CI Quality Gate

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Python DSP Tests & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python DSP Mathematical Unit Tests
        run: python -m unittest discover -s tests_py -v

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Python Engine & TypeScript Check
        run: npm run sync:py && npm run typecheck

      - name: Build Next.js App
        run: npm run build
