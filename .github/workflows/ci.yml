name: Nexus-DSP CI Quality Gate

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Typecheck, Unit Tests (Vitest) & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Run DSP Mathematical Unit Tests
        run: npm run test

      - name: Build Next.js App
        run: npm run build
